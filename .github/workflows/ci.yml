name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      
      - name: Install GJS
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-dev
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run test suite
        run: npm test
      
      - name: Validate extension structure
        run: |
          # Check required files exist
          for file in extension.js metadata.json; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files present"
      
      - name: Validate metadata.json
        run: |
          # Check metadata.json is valid JSON
          python3 -c "import json; json.load(open('metadata.json'))"
          echo "metadata.json is valid JSON"
      
      - name: Validate GSettings schema
        run: |
          glib-compile-schemas --strict schemas/
          echo "GSettings schema is valid"

  validate-ego:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Check for forbidden patterns
        run: |
          # Check for synchronous spawn (forbidden in GNOME extensions)
          if grep -r "spawn_command_line_sync" --include="*.js" .; then
            echo "ERROR: Found spawn_command_line_sync (use async instead)"
            exit 1
          fi
          
          # Check for GTK imports in extension.js
          if grep -E "^import.*Gtk" extension.js; then
            echo "ERROR: GTK imports not allowed in extension.js"
            exit 1
          fi
          
          # Check for global variables
          if grep -E "^(var|let|const)\s+\w+\s*=" extension.js | grep -v "export"; then
            echo "WARNING: Possible global variable in extension.js"
          fi
          
          echo "EGO validation passed"

  shexli:
    # Static analysis with the EGO reviewers' shexli linter, run against the
    # BUILT zip (make dist) so repo-only artifacts (node_modules, build/, .git)
    # don't produce false findings. shexli 0.2.1 segfaults with
    # tree-sitter(-javascript) >= 0.25 (upstream native bug), so we pin < 0.25.
    # The job fails only on error-severity findings; manual_review / warnings
    # are reported but not blocking.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y glib-2.0 zip

      - name: Build distribution zip
        run: make dist

      - name: Install shexli
        run: |
          python -m pip install -U pip
          # shexli 0.2.1 declares tree-sitter>=0.25, but that version segfaults
          # on multi-file runs (upstream native bug). Install shexli normally,
          # then force tree-sitter(-javascript) < 0.25 with --no-deps so pip's
          # resolver doesn't reject the known-good downgrade (ResolutionImpossible).
          pip install shexli
          pip install --no-deps --force-reinstall "tree-sitter<0.25" "tree-sitter-javascript<0.25"

      - name: Run shexli on the packaged extension
        run: |
          ZIP="dist/gp-gnome@totoshko88.github.io.zip"
          echo "== shexli report =="
          shexli "$ZIP" || true
          # Fail on error-severity findings, EXCEPT a documented allowlist of
          # known false positives from shexli's stale ruleset:
          #   EGO-M-004 — flags shell-version "51" as an "implausible future
          #   release". GNOME 51 is a real (RC) release and EGO's own rule
          #   allows stable releases plus one development release, so "51" is
          #   valid; shexli 0.2.1 just has an outdated version table. Remove
          #   this exception once shexli recognizes 51.
          shexli --format json "$ZIP" > shexli.json
          python3 - << 'EOF'
          import json, sys
          ALLOW = {"EGO-M-004"}  # documented false positives (stale shexli table)
          data = json.load(open("shexli.json"))
          blocking = [f for f in data.get("findings", [])
                      if f.get("severity") == "error" and f.get("rule_id") not in ALLOW]
          allowed = [f for f in data.get("findings", [])
                     if f.get("severity") == "error" and f.get("rule_id") in ALLOW]
          for f in allowed:
              print(f"ALLOWED (known false positive): {f['rule_id']} — {f.get('title','')}")
          print(f"shexli blocking error-severity findings: {len(blocking)}")
          if blocking:
              for f in blocking:
                  print(f"  BLOCKING: {f['rule_id']} — {f.get('message','')}")
              sys.exit(1)
          print("shexli OK (no blocking error-severity findings)")
          EOF
